name: Quality gates
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: study
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: study_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U study -d study_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: 'true'
      APP_ORIGIN: http://localhost:3000
      ALLOW_LOCAL_DB: '1'
      DATABASE_URL: postgresql://study:ci-only-password@localhost:5432/study_test
      TEST_DATABASE_URL: postgresql://study:ci-only-password@localhost:5432/study_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/solver-requirements.txt
      - run: python -m pip install -r scripts/solver-requirements.txt
      - run: pnpm solve:nlhe output/regenerated-river.json
      - run: pnpm exec tsx scripts/verify-nlhe.ts output/regenerated-river.json
      - run: python scripts/preflop_equity.py generate output/preflop-generator-equity.json
      - run: pnpm solve:preflop 15 1 output/regenerated-preflop.json
      - run: pnpm verify:nlhe output/regenerated-preflop.json
      # Actual full-prior multi-action execution; diagnostics cannot publish.
      - run: pnpm solve:preflop:attempt 2 15 1 output/preflop-smoke.json
      # V2 remains diagnostic-only. Independently replay its ledger and calibrate
      # numeric CFR/BR against the existing immutable HU and river models.
      - run: pnpm exec tsx scripts/build-preflop-model-v2.ts
      - run: pnpm exec tsx scripts/validate-v2-model.ts
      - run: pnpm exec tsx scripts/export-v2-calibration.ts
      - run: python scripts/test_preflop_v2.py
      - run: python scripts/calibrate-preflop-v2.py
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:unit
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm test:dev-access
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-qa
          path: |
            playwright-report/
            test-results/
          retention-days: 14
